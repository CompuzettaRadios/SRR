<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script id='sonic_js' data-port='8404' src='https://radiostreaming.pro/cp/widgets.js?r=480'></script>
  <title>Historial Radio</title>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a0d2e 0%, #2d1b69 30%, #16213e 70%, #0f1419 100%);
      font-family: "Segoe UI", Tahoma, sans-serif;
      padding: 15px;
      color: #fff;
      min-height: 100vh;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      color: #FFE000;
      font-size: 1.4rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 224, 0, 0.5);
    }
    
    .container {
      max-width: 100%;
      margin: 0 auto;
      height: calc(100vh - 100px);
    }
    
    /* CONTENEDOR ADAPTATIVO DEL HISTORIAL SONICPANEL */
    #sonic_history {
      background: rgba(10, 10, 30, 0.4);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      border: 1px solid rgba(255, 224, 0, 0.2);
      padding: 15px 20px;
      height: 100%;
      max-height: 520px;       /* Altura visible para controlar cuántas se ven */
      overflow-y: auto;        /* Scroll suave si supera la altura */
      
      /* ESTILOS DE TEXTO Y ESPACIADO */
      font-size: 1.05rem;      /* Tamaño de letra más grande y legible */
      line-height: 2.2;        /* Doble espaciado entre canciones */
      color: #ffffff;
    }

    /* FORMATO INDIVIDUAL SI SONICPANEL GENERA PARRAFOS O DIVS */
    #sonic_history div, 
    #sonic_history p,
    #sonic_history line {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 224, 0, 0.15); /* Línea divisoria elegante */
      transition: background 0.2s ease;
    }

    #sonic_history div:hover,
    #sonic_history p:hover {
      color: #FFE000;
    }

    /* SCROLLBAR PERSONALIZADO AMARILLO */
    #sonic_history::-webkit-scrollbar {
      width: 8px;
    }

    #sonic_history::-webkit-scrollbar-track {
      background: rgba(255, 224, 0, 0.1);
      border-radius: 10px;
    }

    #sonic_history::-webkit-scrollbar-thumb {
      background: rgba(255, 224, 0, 0.4);
      border-radius: 10px;
    }

    #sonic_history::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 224, 0, 0.7);
    }

    /* AJUSTES RESPONSIVOS PARA MÓVILES */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      #sonic_history {
        font-size: 0.95rem;   /* Tamaño óptimo para pantallas pequeñas */
        line-height: 2.0;     /* Espaciado ajustado para celular */
        padding: 12px 15px;
        max-height: 450px;
      }
    }

    /* EFECTO DE DESPLAZAMIENTO Y MARGINACIÓN PARA MÓVILES */
    @media (max-width: 768px) {
      #sonic_history div, 
      #sonic_history p,
      #sonic_history li {
        white-space: nowrap !important;   /* Impide que el texto baje a una segunda línea */
        overflow-x: auto !important;      /* Permite el desplazamiento horizontal táctil */
        text-overflow: clip !important;   /* Evita los tres puntos (...) para que se vea completo */
        -webkit-overflow-scrolling: touch;/* Desplazamiento suave en iOS y Android */
        padding-bottom: 8px;
      }

      /* Ocultar la barra de scroll horizontal para una vista limpia */
      #sonic_history div::-webkit-scrollbar,
      #sonic_history p::-webkit-scrollbar {
        display: none;
      }
    }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>TEMAS ANTERIORES</h1>
    </div>
    
<div id="sonic_history"></div>
  </div>

  <script>

  </script>
</body>
</html>
